[project]
name = "visual-memory-assistant"
version = "0.1.0"
description = "On-device visual memory for the Jetson Orin Nano (CLIP + FAISS + Moondream2)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
